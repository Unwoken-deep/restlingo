<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест — RestLingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        if (localStorage.getItem('restlingo_theme') === 'light') {
            document.body.classList.add('light');
            document.body.style.opacity = '0';
        }
    </script>

    <div class="app">

        <header class="header">
            <div class="logo">🌙 RestLingo</div>
            <nav class="nav">
                <a href="index.html">Карточки</a>
                <a href="test.html">Тест</a>
                <a href="dictionary.html">Словарь</a>
                <a href="feedback.html">Обратная связь</a>
            </nav>
        </header>

        <main class="test-wrap">
            <h2>📝 Тест</h2>
            <p class="test-sub">Проверь себя</p>

            <!-- Настройки -->
            <div class="test-settings" id="test-settings">
                <div class="test-type">
                    <button class="test-type-btn active" data-test-type="all">Все</button>
                    <button class="test-type-btn" data-test-type="word">Слова</button>
                    <button class="test-type-btn" data-test-type="phrase">Фразы</button>
                </div>

                <div class="test-direction">
                    <button class="direction-btn active" data-direction="en-ru">🇬🇧 → 🇷🇺</button>
                    <button class="direction-btn" data-direction="ru-en">🇷🇺 → 🇬🇧</button>
                </div>

                <div class="test-count">
                    <button class="count-btn active" data-count="10">10</button>
                    <button class="count-btn" data-count="15">15</button>
                    <button class="count-btn" data-count="30">30</button>
                    <button class="count-btn" data-count="50">50</button>
                    <button class="count-btn" data-count="all">Все</button>
                </div>

                <button id="start-test" class="start-test-btn">Начать</button>
            </div>

            <!-- Тест -->
            <div class="test-card" id="test-card" style="display:none;">
                <p class="test-word" id="test-word"></p>
                <div class="test-options" id="test-options"></div>

                <div class="test-footer">
                    <span id="test-score"></span>
                    <div class="test-actions">
                        <button id="next-test-button" class="next-test-btn">Дальше →</button>
                        <button id="finish-test-button" class="finish-test-btn">Завершить</button>
                    </div>
                </div>
            </div>

            <!-- Результат -->
            <div class="test-result" id="test-result" style="display:none;">
                <h3>Тест завершён</h3>
                <p id="result-correct"></p>
                <p id="result-wrong"></p>
                <p id="result-phrase" class="result-phrase"></p>
                <button id="restart-test" class="restart-test-btn">Пройти заново</button>
            </div>
        </main>

    </div>

    <script src="test.js"></script>
</body>
