<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — RestLingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        if (localStorage.getItem('restlingo_theme') === 'light') {
            document.body.classList.add('light');
            document.body.style.opacity = '0';
        }
    </script>

    <div class="app">

        <header class="header">
            <div class="logo">🌙 RestLingo</div>
            <nav class="nav">
                <a href="index.html">Карточки</a>
                <a href="test.html">Тест</a>
                <a href="dictionary.html">Словарь</a>
                <a href="feedback.html">Обратная связь</a>
            </nav>
        </header>

        <main class="feedback-wrap">
            <h2>💬 Обратная связь</h2>
            <p class="feedback-sub">Мне важно, что ты думаешь о RestLingo</p>

            <div class="feedback-types">
                <button class="feedback-type-btn" data-type="💡 Идея">💡 Идея</button>
                <button class="feedback-type-btn" data-type="🐛 Ошибка">🐛 Ошибка</button>
                <button class="feedback-type-btn" data-type="❤️ Просто спасибо">❤️ Спасибо</button>
            </div>

            <textarea id="feedback-message" rows="8" placeholder="Напиши здесь..."></textarea>

            <button id="send-feedback" class="send-feedback-btn">Отправить</button>
        </main>

    </div>

    <script src="feedback.js"></script>
</body>
</html>
