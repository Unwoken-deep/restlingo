<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestLingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        if (localStorage.getItem('restlingo_theme') === 'light') {
            document.body.classList.add('light');
            document.body.style.opacity = '0';
        }
    </script>

    <div class="app">

        <header class="header">
            <div class="logo">🌙 RestLingo</div>
            <nav class="nav">
                <a href="index.html">Карточки</a>
                <a href="test.html">Тест</a>
                <a href="dictionary.html">Словарь</a>
                <a href="feedback.html">Обратная связь</a>
            </nav>
        </header>

        <main class="layout">

            <section class="moon-zone">
                <div class="moon" id="moon"></div>
                <div class="days" id="days-count">1</div>
                <div class="moon-phrase" id="moon-phrase">Ну что, погнали?</div>
            </section>

            <section class="card-zone">
                <button class="arrow" id="prev-arrow">←</button>

                <div class="card" id="flashcard">
                    <div class="card-front">
                        <p id="word">Hello</p>
                        <p class="hint">нажми на карточку</p>
                    </div>
                    <div class="card-back">
                        <p id="translation">Привет</p>
                    </div>
                </div>

                <button class="arrow" id="next-arrow">→</button>
            </section>

            <aside class="panel">
                <div class="panel-header">
                    <h2>Управление</h2>
                    <button id="theme-toggle" class="theme-toggle">☀️</button>
                </div>

                <div class="add-block">
                    <input type="text" id="new-word" placeholder="Слово или фраза">
                    <input type="text" id="new-translation" placeholder="Перевод">
                    <button id="add-button">Добавить</button>
                </div>

                <div class="panel-actions">
                    <button id="shuffle-button">Перемешать</button>
                    <button id="delete-button">Удалить</button>
                </div>

                <div class="counter">
                    Карточек: <span id="card-counter">0</span>
                </div>
            </aside>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
